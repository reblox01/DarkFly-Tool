# Continuous integration for the modern DarkFly CLI.
#
# Runs the test suite on the two supported Python lines, validates
# the v2 catalog, and smoke-tests the CLI's dry-run path. This is
# separate from python-publish.yml, which only publishes releases.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with dev dependencies
        run: python -m pip install -e .[dev]

      - name: Run the test suite
        run: pytest

      - name: Validate the catalog
        run: >-
          python -c "from darkfly.catalog import load_catalog;
          c = load_catalog(); print(f'catalog OK: {len(c)} tools')"

      - name: Dry-run smoke test
        run: |
          DarkFly5 install nmap --dry-run
          DarkFly5 doctor
