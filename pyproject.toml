[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkfly-tool"
version = "5.1.1"
description = "Modern Python 3 CLI for DarkFly-Tool (wrapper/launcher for security tools)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "DarkFly-Tool maintainers" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux"
]

[project.urls]
Homepage = "https://github.com/reblox01/DarkFly-Tool"
Source = "https://github.com/reblox01/DarkFly-Tool"

[project.optional-dependencies]
# Keep dependencies minimal; YAML can be added later if desired.
 dev = [
  "pytest>=7",
  "pytest-cov>=4",
]

[project.scripts]
# New modern CLI entrypoint
DarkFly5 = "darkfly.cli:main"

# Minimal setuptools-style config to treat src as package root
[tool.setuptools]
package-dir = {"" = "."}

# Ship the v2 catalog inside the package so installs outside a clone
# still find it (darkfly.catalog falls back to the package directory).
# tests/test_packaging.py keeps darkfly/catalog.json byte-identical
# to the root catalog.json.
[tool.setuptools.package-data]
darkfly = ["catalog.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["darkfly*"]
